<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boilergen — YAML → Code Generator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='6' cy='16' r='3' fill='%23f7c948'/><path d='M9 16 L24 8' stroke='%238d96a3' stroke-width='1.5' stroke-linecap='round'/><path d='M9 16 L24 16' stroke='%238d96a3' stroke-width='1.5' stroke-linecap='round'/><path d='M9 16 L24 24' stroke='%238d96a3' stroke-width='1.5' stroke-linecap='round'/><circle cx='25' cy='8' r='2.5' fill='%23b08bff'/><circle cx='25' cy='16' r='2.5' fill='%2358a6ff'/><circle cx='25' cy='24' r='2.5' fill='%233fb950'/></svg>">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #0a0c10;
  --bg-1: #11141a;
  --bg-2: #181c24;
  --bg-3: #20252e;
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text: #e6edf3;
  --text-muted: #8d96a3;
  --text-dim: #5d6573;

  --accent: #f7c948;
  --purple: #b08bff;
  --blue: #58a6ff;
  --green: #3fb950;
  --red: #f85149;

  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;

  --radius: 6px;
  --radius-lg: 10px;
  --transition: 120ms cubic-bezier(0.2, 0, 0, 1);
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

html, body { height: 100%; }
body {
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv02', 'cv03', 'cv11';
}

button { font: inherit; cursor: pointer; }

/* ========== HEADER ========== */
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  height: 56px;
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; flex-shrink: 0; }
.brand-text {
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.brand-text .gen { color: var(--accent); }

.dot-sep { color: var(--text-dim); margin: 0 4px; user-select: none; }
.subtitle { color: var(--text-muted); font-size: 12.5px; }

.spacer { flex: 1; }
.plugin-info {
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: var(--mono);
  padding: 5px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.plugin-info .label { color: var(--text-dim); }

.gh-link {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: var(--radius);
  transition: var(--transition);
}
.gh-link:hover { color: var(--text); background: var(--bg-2); }

/* ========== MAIN LAYOUT ========== */
main {
  display: grid;
  grid-template-columns: minmax(380px, 38%) 1fr;
  height: calc(100vh - 56px);
}

/* ========== INPUT PANEL ========== */
#input-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  min-width: 0;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.panel-title { color: var(--text); font-weight: 500; }
.panel-title .icon { color: var(--text-muted); margin-right: 6px; }

.examples { display: flex; gap: 4px; }
.example-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 11px;
  font-family: var(--mono);
  transition: var(--transition);
}
.example-btn:hover {
  color: var(--text);
  background: var(--bg-2);
  border-color: var(--border-strong);
}

#yaml-input {
  flex: 1;
  background: var(--bg-1);
  color: var(--text);
  border: none;
  padding: 18px 20px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  tab-size: 2;
  font-feature-settings: 'calt', 'liga';
}
#yaml-input::placeholder { color: var(--text-dim); }

.actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  background: var(--bg-1);
  border-top: 1px solid var(--border);
}
.btn {
  background: var(--accent);
  color: #1a1305;
  border: none;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 12.5px;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: #ffd75d; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(247, 201, 72, 0.25); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: wait; transform: none; box-shadow: none; }
.btn .kbd {
  background: rgba(0, 0, 0, 0.18);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 500;
}
.btn.ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  font-weight: 500;
}
.btn.ghost:hover {
  background: var(--bg-2);
  color: var(--text);
  border-color: var(--border-strong);
  transform: none;
  box-shadow: none;
}

/* ========== OUTPUT PANEL ========== */
#output-panel {
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
  min-height: 0;
}

#status-bar {
  background: var(--bg-1);
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font-family: var(--mono);
  transition: var(--transition);
}
#status-bar.success { background: linear-gradient(to right, rgba(63, 185, 80, 0.06), transparent 50%); }
#status-bar.error { color: var(--red); background: linear-gradient(to right, rgba(248, 81, 73, 0.08), transparent 50%); }

.badge {
  background: var(--bg-2);
  color: var(--text);
  padding: 3px 9px;
  border-radius: 10px;
  font-size: 11px;
  border: 1px solid var(--border);
  font-family: var(--mono);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge .label { color: var(--text-dim); font-size: 10px; }
.badge.green { color: var(--green); border-color: rgba(63, 185, 80, 0.3); background: rgba(63, 185, 80, 0.06); }
.badge.blue { color: var(--blue); border-color: rgba(88, 166, 255, 0.3); background: rgba(88, 166, 255, 0.06); }
.badge.purple { color: var(--purple); border-color: rgba(176, 139, 255, 0.3); background: rgba(176, 139, 255, 0.06); }

#output-grid {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 0;
}

/* ========== FILE LIST ========== */
#file-list {
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 6px;
}
.file-item {
  padding: 9px 12px;
  cursor: pointer;
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 11.5px;
  transition: var(--transition);
  margin-bottom: 2px;
  border-left: 2px solid transparent;
}
.file-item:hover { background: var(--bg-2); }
.file-item.active {
  background: var(--bg-2);
  border-left-color: var(--accent);
}
.file-item .target {
  color: var(--blue);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.file-item .name {
  color: var(--text);
  margin-top: 3px;
  word-break: break-all;
  line-height: 1.4;
}
.file-item.active .name { color: var(--accent); }
.file-item .inject-tag {
  display: inline-block;
  background: rgba(176, 139, 255, 0.15);
  color: var(--purple);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 9px;
  margin-top: 4px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: 1px solid rgba(176, 139, 255, 0.25);
}

#file-list .empty-list {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 11.5px;
  font-family: var(--mono);
}

/* ========== FILE CONTENT ========== */
#file-content {
  display: flex;
  flex-direction: column;
  background: var(--bg-0);
  min-width: 0;
  min-height: 0;
}

#file-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-family: var(--mono);
}
#file-toolbar .breadcrumb {
  color: var(--text-muted);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}
#file-toolbar .breadcrumb .filename { color: var(--text); font-weight: 500; }
#file-toolbar .stat {
  color: var(--text-dim);
  font-size: 10.5px;
  padding: 0 6px;
}

.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 11px;
  font-family: var(--mono);
  transition: var(--transition);
}
.tab-btn:hover {
  color: var(--text);
  background: var(--bg-2);
}
.tab-btn.active {
  color: var(--accent);
  background: rgba(247, 201, 72, 0.08);
  border-color: rgba(247, 201, 72, 0.3);
}
.tab-btn.copy {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.tab-btn.copy:hover {
  color: var(--green);
  border-color: rgba(63, 185, 80, 0.4);
  background: rgba(63, 185, 80, 0.06);
}
.tab-btn.copied {
  color: var(--green);
  border-color: rgba(63, 185, 80, 0.5);
  background: rgba(63, 185, 80, 0.1);
}

#file-body {
  flex: 1;
  overflow: auto;
  min-height: 0;
}
#file-body pre {
  margin: 0;
  padding: 18px 20px !important;
  font-size: 12.5px !important;
  line-height: 1.65 !important;
  background: transparent !important;
}
#file-body code {
  font-family: var(--mono) !important;
  font-feature-settings: 'calt', 'liga';
}

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  flex-direction: column;
  gap: 12px;
  padding: 60px 40px;
  text-align: center;
}
.empty-state svg { opacity: 0.3; }
.empty-state .title { font-size: 14px; color: var(--text-muted); font-weight: 500; }
.empty-state .desc { font-size: 12px; color: var(--text-dim); max-width: 320px; line-height: 1.6; }
.empty-state kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 2px 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-muted);
}

.hint {
  color: var(--purple);
  font-size: 11px;
  padding: 8px 20px;
  background: rgba(176, 139, 255, 0.05);
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  display: flex;
  align-items: center;
  gap: 8px;
}
.hint::before { content: '↳'; opacity: 0.6; }

.error-block {
  padding: 16px 20px;
  color: var(--red);
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  background: rgba(248, 81, 73, 0.04);
  border-left: 2px solid var(--red);
  margin: 16px;
  border-radius: 0 var(--radius) var(--radius) 0;
}

/* ========== SCROLLBARS ========== */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 5px; border: 2px solid var(--bg-1); }
::-webkit-scrollbar-thumb:hover { background: #2c3340; }

/* ========== ANIMATIONS ========== */
@keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 200ms ease-out; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
const examples = {
  profession: `# yaml-language-server: $schema=../boilergen.schema.json
id: taxi_driver
type: profession
name: Таксист
data:
  baseSalary: 500
  category: transport
  description: Возит пассажиров за деньги
`,
  weapon: `# yaml-language-server: $schema=../boilergen.schema.json
id: ak47
type: weapon
name: АК-47
data:
  category: rifle
  damage: 45
  fireRate: 600
  magazineSize: 30
  range: 350
  reloadTime: 2.4
  price: 15000
  description: Автомат Калашникова
`,
};

const $ = (id) => document.getElementById(id);
const yamlInput = $('yaml-input');
const generateBtn = $('generate-btn');
const clearBtn = $('clear-btn');
const fileList = $('file-list');
const fileBody = $('file-body');
const fileToolbar = $('file-toolbar');
const breadcrumb = $('breadcrumb');
const statEl = $('stat');
const tabOutput = $('tab-output');
const tabSource = $('tab-source');
const copyBtn = $('copy-btn');
const statusBar = $('status-bar');
const statusText = $('status-text');
const pluginInfo = $('plugin-info');

let lastFiles = [];
let activeIdx = -1;
let activeView = 'output';

function langFromPath(path) {
  if (path.endsWith('.cpp') || path.endsWith('.h') || path.endsWith('.hpp')) return 'cpp';
  if (path.endsWith('.ts') || path.endsWith('.tsx')) return 'typescript';
  if (path.endsWith('.js') || path.endsWith('.jsx')) return 'javascript';
  if (path.endsWith('.dart')) return 'dart';
  if (path.endsWith('.json')) return 'json';
  if (path.endsWith('.yaml') || path.endsWith('.yml')) return 'yaml';
  if (path.endsWith('.sql')) return 'sql';
  if (path.endsWith('.py')) return 'python';
  if (path.endsWith('.cs')) return 'csharp';
  return 'text';
}

function emptyState(title, desc) {
  return `<div class="empty-state fade-in">
    <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
      <circle cx="6" cy="16" r="3" fill="#f7c948"/>
      <path d="M9 16 L24 8" stroke="#8d96a3" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M9 16 L24 16" stroke="#8d96a3" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M9 16 L24 24" stroke="#8d96a3" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="25" cy="8" r="2.5" fill="#b08bff"/>
      <circle cx="25" cy="16" r="2.5" fill="#58a6ff"/>
      <circle cx="25" cy="24" r="2.5" fill="#3fb950"/>
    </svg>
    <div class="title">${title}</div>
    <div class="desc">${desc}</div>
  </div>`;
}

function renderFileList(files) {
  if (files.length === 0) {
    fileList.innerHTML = '<div class="empty-list">No matching templates</div>';
    return;
  }
  fileList.innerHTML = files.map((f, i) => `
    <div class="file-item ${i === activeIdx ? 'active' : ''}" data-idx="${i}">
      <div class="target">${f.target}${f.inject ? ' · inject' : ''}</div>
      <div class="name">${f.path}</div>
      ${f.inject ? `<div class="inject-tag">${f.inject.mode.toUpperCase()} «${f.inject.anchor.slice(0, 22)}»</div>` : ''}
    </div>
  `).join('');
  fileList.querySelectorAll('.file-item').forEach((el) => {
    el.addEventListener('click', () => selectFile(parseInt(el.dataset.idx, 10)));
  });
}

function selectFile(idx) {
  activeIdx = idx;
  renderFileList(lastFiles);
  renderActiveView();
}

function renderActiveView() {
  const f = lastFiles[activeIdx];
  if (!f) {
    fileToolbar.style.display = 'none';
    fileBody.innerHTML = emptyState('No file selected', 'Click <strong>Generate</strong> or press <kbd>⌘↵</kbd> to render templates.');
    return;
  }
  fileToolbar.style.display = 'flex';

  const showingSource = activeView === 'source';
  tabOutput.classList.toggle('active', !showingSource);
  tabSource.classList.toggle('active', showingSource);

  const text = showingSource ? f.templateSource : f.content;
  const lang = showingSource ? 'handlebars' : langFromPath(f.path);
  const path = showingSource ? f.templatePath : f.path;

  breadcrumb.innerHTML = `<span class="filename">${escapeHtml(path)}</span>`;
  statEl.textContent = `${text.length}c · ${text.split('\n').length}l`;

  const hint = showingSource
    ? '<div class="hint">Raw template source. Compare with Output to see what got substituted.</div>'
    : '';
  fileBody.innerHTML = `${hint}<pre class="fade-in"><code class="language-${lang}"></code></pre>`;
  fileBody.querySelector('code').textContent = text;
  if (window.Prism) Prism.highlightAllUnder(fileBody);
}

async function copyActive() {
  const f = lastFiles[activeIdx];
  if (!f) return;
  const text = activeView === 'source' ? f.templateSource : f.content;
  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = '✓ Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1500);
  } catch {
    copyBtn.textContent = '✗ failed';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function generate() {
  generateBtn.disabled = true;
  const originalText = generateBtn.innerHTML;
  generateBtn.innerHTML = '<span class="pulse">Generating…</span>';
  try {
    const res = await fetch('/api/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ yaml: yamlInput.value }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusBar.className = 'error';
      statusText.style.color = 'var(--red)';
      statusText.textContent = '✗ ' + (data.error ?? 'Unknown error');
      lastFiles = [];
      activeIdx = -1;
      fileList.innerHTML = '<div class="empty-list">No files generated</div>';
      fileToolbar.style.display = 'none';
      fileBody.innerHTML = `<div class="error-block">${escapeHtml(data.error ?? 'Unknown error')}</div>`;
      return;
    }
    lastFiles = data.files;
    activeIdx = data.files.length > 0 ? 0 : -1;
    statusBar.className = 'success';
    statusText.style.color = 'var(--text)';
    statusText.innerHTML = `
      <span class="badge blue">${escapeHtml(data.schema.id)}</span>
      <span class="badge"><span class="label">type</span> ${escapeHtml(data.schema.type)}</span>
      <span class="badge purple">matched ${data.matched}/${data.total}</span>
      <span class="badge green">${data.files.length} files</span>
    `;
    renderFileList(lastFiles);
    if (activeIdx >= 0) selectFile(0);
    else {
      fileToolbar.style.display = 'none';
      fileBody.innerHTML = emptyState('No matching templates', `Plugin has ${data.total} templates, but none for entity type <strong>"${escapeHtml(data.schema.type)}"</strong>.<br>Try the <strong>${data.schema.type === 'profession' ? 'weapon' : 'profession'}</strong> example.`);
    }
  } catch (err) {
    statusBar.className = 'error';
    statusText.style.color = 'var(--red)';
    statusText.textContent = '✗ ' + err.message;
  } finally {
    generateBtn.disabled = false;
    generateBtn.innerHTML = originalText;
  }
}

document.querySelectorAll('.example-btn').forEach((b) => {
  b.addEventListener('click', () => {
    yamlInput.value = examples[b.dataset.example];
    yamlInput.focus();
  });
});

generateBtn.addEventListener('click', generate);
clearBtn.addEventListener('click', () => {
  yamlInput.value = '';
  lastFiles = [];
  activeIdx = -1;
  fileList.innerHTML = '<div class="empty-list">Files appear here<br>after generation</div>';
  fileToolbar.style.display = 'none';
  fileBody.innerHTML = emptyState('No file selected', 'Click <strong>Generate</strong> or press <kbd>⌘↵</kbd> to render templates.');
  statusBar.className = '';
  statusText.style.color = 'var(--text-dim)';
  statusText.textContent = 'Ready — paste YAML and click Generate.';
  yamlInput.focus();
});
tabOutput.addEventListener('click', () => { activeView = 'output'; renderActiveView(); });
tabSource.addEventListener('click', () => { activeView = 'source'; renderActiveView(); });
copyBtn.addEventListener('click', copyActive);

yamlInput.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    generate();
  }
});

// Bootstrap
yamlInput.value = examples.weapon;
fetch('/api/plugin').then((r) => r.json()).then((p) => {
  if (p.error) {
    pluginInfo.innerHTML = '<span style="color:var(--red);">plugin error</span>';
    return;
  }
  const byType = {};
  p.templates.forEach((t) => {
    byType[t.entityType] = (byType[t.entityType] ?? 0) + 1;
  });
  const types = Object.entries(byType).map(([t, n]) => `${t} ×${n}`).join(' · ');
  pluginInfo.innerHTML = `<span class="label">plugin:</span> ${escapeHtml(p.id)} <span class="label">·</span> ${p.templates.length} tpl <span class="label">(${escapeHtml(types)})</span>`;
}).catch(() => {
  pluginInfo.innerHTML = '<span style="color:var(--red);">offline</span>';
});
</script>
</body>
</html>
